<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>移民案件期限与材料管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 960px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .8rem; }
  </style>
</head>
<body>
<main>
  <h1>移民案件期限与材料管理</h1>
  <p>最小演示页。受理会快照当前政策版本；发布新版本后草稿自动重算，已提交案件保持原版本。</p>
  <div class="row">
    <button id="policy">查看当前政策</button>
    <button id="policies">政策版本历史</button>
    <button id="load">加载记录</button>
    <button id="stats">状态统计</button>
    <button id="intake">受理示例案件</button>
  </div>
  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo","Content-Type":"application/json"};
const out = (data) => { document.getElementById("output").textContent = JSON.stringify(data, null, 2); };
async function show(path) {
  const response = await fetch(path, {headers});
  out(await response.json());
}
async function intake() {
  const policy = await (await fetch("/api/policies/current", {headers})).json();
  const response = await fetch("/api/records", {
    method: "POST",
    headers: {...headers, "Idempotency-Key": "demo-intake-" + Date.now()},
    body: JSON.stringify({
      reference: "IMM-DEMO-" + Date.now(),
      expected_policy_version: policy.version,
      data: {applicant_id: "A-DEMO", case_type: "family", received_day: 100, response_day: 105, representation_active: true}
    })
  });
  out(await response.json());
}
document.getElementById("policy").onclick = () => show("/api/policies/current");
document.getElementById("policies").onclick = () => show("/api/policies");
document.getElementById("load").onclick = () => show("/api/records?limit=20");
document.getElementById("stats").onclick = () => show("/api/stats");
document.getElementById("intake").onclick = intake;
</script>
</body>
</html>
